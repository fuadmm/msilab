name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # If your project requires building (e.g. Next.js export, React/Vite), 
      # uncomment these build steps:
      # - name: Install & Build
      #   run: |
      #     npm ci
      #     npm run build

      - name: SFTP Sync to cPanel
        uses: jakirseu/SFTP-Action-cPanel@main
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          # Change target to your subdomain folder if different:
          target: 'public_html/'
